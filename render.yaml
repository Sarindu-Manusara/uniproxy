services:
  - type: web
    name: uniproxy-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_DATASOURCE_DRIVER_CLASS_NAME
        value: org.postgresql.Driver
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SPRING_JPA_SHOW_SQL
        value: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 86400000
      - key: NOWPAYMENTS_API_KEY
        sync: false
      - key: NOWPAYMENTS_API_URL
        value: https://api.nowpayments.io/v1/payment
      - key: APP_BASE_URL
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: CATPROXIES_API_KEY
        sync: false
      - key: CATPROXIES_API_BASE_URL
        value: https://catproxies.com/api/v1/public
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:3000,http://localhost:3001,https://uniproxy-frontend.onrender.com,https://uniproxy.netlify.app,https://uniproxy.cc
      - key: APP_SEED_USER_USERNAME
        value: user
      - key: APP_SEED_USER_EMAIL
        value: user@uniproxy.local
      - key: APP_SEED_USER_PASSWORD
        sync: false
      - key: APP_SEED_ADMIN_USERNAME
        value: admin
      - key: APP_SEED_ADMIN_EMAIL
        value: admin@uniproxy.local
      - key: APP_SEED_ADMIN_PASSWORD
        sync: false
  - type: web
    name: uniproxy-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/out
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
