spring.application.name=uniproxy

# Server Configuration
server.address=0.0.0.0
server.port=${PORT:8080}

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/proxy_system}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

# JPA Settings
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# App Settings
app.base-url=${APP_BASE_URL:http://localhost:8080}
frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}
app.jwt.secret=${JWT_SECRET:yourSecretKeyForUniProxyProject2026Secure}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,https://uniproxy.cc}

# NOWPayments
nowpayments.api-key=${NOWPAYMENTS_API_KEY:}
nowpayments.api-url=${NOWPAYMENTS_API_URL:https://api.nowpayments.io/v1/payment}

# CatProxies Reseller API
catproxies.api-base-url=${CATPROXIES_API_BASE_URL:https://catproxies.com/api/v1/public}
catproxies.api-key=${CATPROXIES_API_KEY:}
